[project]
name = "ai_data_science_team"
version = "1"
description = "final project"
authors = [
    {name = "Mehrdad"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.2.3,<3.0.0)",
    "numpy (>=2.2.4,<3.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "h2o (>=3.46.0.6,<4.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "time-series-analysis"
version = "0.1.0"
description = "Time series analysis project"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.26.0"
pandas = "^2.1.0"
matplotlib = "^3.7.0"
seaborn = "^0.13.0"
yfinance = "^0.2.31"
scikit-learn = "^1.3.0"
tensorflow = "^2.13.0"
torch = "^2.1.0"
statsmodels = "^0.14.0"
xgboost = "^2.0.0"
pmdarima = "^2.0.3"

[tool.poetry.group.dev.dependencies]
black = "^23.10.0"
pytest = "^7.4.3"
jupyterlab = "^4.3.6"

